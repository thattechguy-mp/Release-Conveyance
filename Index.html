<!DOCTYPE html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:Arial,sans-serif;color:#16334a;background:#eef4f7}*{box-sizing:border-box}main{max-width:740px;margin:32px auto;background:white;border-radius:14px;padding:30px;box-shadow:0 8px 35px #173c501b}header{border-bottom:3px solid #009fe3;padding-bottom:18px;margin-bottom:24px}.brand{font-size:22px;letter-spacing:3px;color:#009fe3}.brand span{color:#62c46a}h1{font-size:24px}label{display:block;font-weight:600;margin:15px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #b6c9d4;border-radius:6px;font:inherit}textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}button{background:#007cbd;color:white;border:0;border-radius:7px;padding:13px 18px;font-weight:bold;cursor:pointer;margin-top:20px}button:disabled{opacity:.5}.muted{color:#526b7c}.panel{background:#f1f7fa;padding:18px;border-radius:9px;margin:15px 0}.notice{border-left:4px solid #e6a400;padding:12px;background:#fff9e6}#msg{margin-top:20px;white-space:pre-wrap}.check{display:flex;align-items:flex-start;gap:10px;margin-top:15px}.check input{width:auto;margin-top:3px}@media(max-width:550px){main{margin:0;border-radius:0;padding:18px}.two{grid-template-columns:1fr}}
</style></head><body><main><header><div class="brand">right<span>✓</span>move storage</div><div class="muted">Aldine Storage · 21667 Aldine Westfield Rd, Humble, TX 77338</div></header><h1>Release & Conveyance</h1><div id="admin" style="display:none"><p class="muted">Manager prefill — email addresses are routing details only and do not appear in the agreement.</p><form id="af"><div class="two"><div><label>Unit number</label><input name="unit" pattern="[0-9]{5}" maxlength="5" placeholder="00311" required></div><div><label>Administrative fee ($)</label><input name="fee" type="number" min="0" step="0.01" value="25.00" required></div></div><label>Releasing tenant / legal company name</label><input name="releasing" required><label>Authorized representative (if company)</label><input name="representative"><label>Releasing tenant email (private)</label><input name="releaseEmail" type="email" required><label>New tenant full name</label><input name="newTenant" required><label>New tenant email (private)</label><input name="newEmail" type="email" required><label>Additional factual details (optional)</label><textarea name="details" maxlength="1500"></textarea><label>Administrator passphrase</label><input id="pass" type="password" autocomplete="off" required><button id="start">Start signature sequence</button></form><hr><h3>Check / resend an existing case</h3><label>Document reference</label><input id="caseId" placeholder="ALD-YYYYMMDD-XXXXXXXX"><button onclick="checkStatus()">Check status</button> <button onclick="resend()">Resend current invitation</button></div><div id="sign" style="display:none"><div id="caseView"></div><label>Type your full legal name as your signature</label><input id="typed" maxlength="150"><label class="check"><input type="checkbox" id="consent"><span>I have reviewed this agreement, intend to sign it electronically, and agree that my typed name constitutes my electronic signature.</span></label><label class="check" id="authorityRow" style="display:none"><input type="checkbox" id="authority"><span>I confirm that I am authorized to sign on behalf of the named releasing organization.</span></label><button id="signBtn" onclick="submitSignature()">Sign document</button></div><div id="msg" role="status"></div></main><script>
const MODE='<?= mode ?>',TOKEN='<?= token ?>';const $=x=>document.getElementById(x);let active=null;function show(s,err=false){$('msg').textContent=s;$('msg').style.color=err?'#a92323':'#176c42'}function fail(e){show(e.message||String(e),true);$('start').disabled=false;$('signBtn').disabled=false}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(MODE==='sign'){$('sign').style.display='block';google.script.run.withSuccessHandler(d=>{active=d;$('caseView').innerHTML='<div class="panel"><b>Document '+esc(d.id)+'</b><p><b>Role:</b> '+esc(d.role)+'</p><p><b>Storage unit:</b> '+esc(d.unit)+'</p><p><b>Releasing tenant:</b> '+esc(d.releasing)+'</p><p><b>Authorized representative:</b> '+esc(d.representative||'N/A')+'</p><p><b>New tenant:</b> '+esc(d.newTenant)+'</p><p><b>Administrative charge (if applicable):</b> $'+esc(d.fee)+'</p><p>'+esc(d.details)+'</p></div><div class="notice"><b>Conveyance of stored belongings only.</b> The Releasing Tenant conveys their right, title and interest, if any, in the personal property presently stored in unit '+esc(d.unit)+' to the New Tenant. The New Tenant accepts the conveyance. This does not transfer the rental agreement, grant access or possession, waive any unpaid balance or valid lien, or establish ownership against third parties. Any new rental requires a separate agreement, identification, applicable payment, and facility approval.</div>';$('authorityRow').style.display=d.step===0&&d.representative?'flex':'none';}).withFailureHandler(fail).viewCase(TOKEN)}else{$('admin').style.display='block'}
$('af').addEventListener('submit',e=>{e.preventDefault();$('start').disabled=true;const p=Object.fromEntries(new FormData(e.target).entries());google.script.run.withSuccessHandler(d=>{show('Created '+d.id+' — '+d.status+'. Save this reference.');$('start').disabled=false;}).withFailureHandler(fail).startCase(p,$('pass').value)});
function submitSignature(){if(!active)return;const name=$('typed').value.trim();if(!name||!$('consent').checked){show('Enter your signature and confirm consent.',true);return}$('signBtn').disabled=true;google.script.run.withSuccessHandler(d=>{$('sign').style.display='none';show(d.message)}).withFailureHandler(fail).signCase(TOKEN,name,$('consent').checked,$('authority').checked)}
function checkStatus(){google.script.run.withSuccessHandler(d=>show(d.id+' | '+d.status+' | Unit '+d.unit+(d.completed?' | Completed '+d.completed:''))).withFailureHandler(fail).statusCase($('caseId').value.trim(),$('pass').value)}
function resend(){if(!confirm('Invalidate the previous link and email a new invitation?'))return;google.script.run.withSuccessHandler(d=>show('Invitation resent: '+d.status)).withFailureHandler(fail).resendCase($('caseId').value.trim(),$('pass').value)}
</script></body></html>
